events {}

# Layer 4 (TCP/UDP) load balancing via the stream module.
stream {
    upstream tcp_backends {
        server tcpbackend1:9092;
        server tcpbackend2:9092;
    }

    upstream udp_backends {
        server udpbackend1:9094;
        server udpbackend2:9094;
    }

    log_format l4 '$remote_addr -> $upstream_addr '
                  'proto=$protocol status=$status bytes_sent=$bytes_sent '
                  'session_time=$session_time';
    access_log /dev/stdout l4;

    server {
        listen 9000;
        proxy_pass tcp_backends;
    }

    server {
        listen 9001 udp;
        proxy_pass udp_backends;
    }
}

http {
    # Two application backends receiving proxied traffic.
    upstream app_backends {
        server backend1:9090;
        server backend2:9090;
    }

    # Log line shows which upstream backend actually served each request.
    log_format upstream_log '$remote_addr -> $upstream_addr '
                            '"$request" status=$status '
                            'req_time=$request_time upstream_time=$upstream_response_time';

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    server {
        listen 8080;

        location / {
            proxy_pass http://app_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
