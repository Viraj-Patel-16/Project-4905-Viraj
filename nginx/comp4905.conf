worker_processes  1;

events {
    worker_connections  1024;
}

# Layer 4 (TCP/UDP) load balancing via the stream module.
stream {
    upstream tcp_backends {
        server 127.0.0.1:9092;
        server 127.0.0.1:9093;
    }

    upstream udp_backends {
        server 127.0.0.1:9094;
        server 127.0.0.1:9095;
    }

    log_format l4 '$remote_addr -> $upstream_addr '
                  'proto=$protocol status=$status bytes_sent=$bytes_sent '
                  'session_time=$session_time';

    access_log logs/stream_access.log l4;

    server {
        listen 127.0.0.1:9000;
        proxy_pass tcp_backends;
    }

    # NOTE: UDP datagram proxying (listen ... udp) is NOT supported by the
    # Windows NGINX build. Use the Docker/Linux stack (docker/nginx.conf) for
    # UDP L4 load balancing.
}

http {
    upstream app_backends {
        server 127.0.0.1:9090;
        server 127.0.0.1:9091;
    }

    log_format upstream_log '$remote_addr -> $upstream_addr '
                            '"$request" status=$status '
                            'req_time=$request_time upstream_time=$upstream_response_time';

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        access_log logs/access.log upstream_log;

        location / {
            proxy_pass http://app_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
