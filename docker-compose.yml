services:
  backend1:
    image: python:3.12-slim
    container_name: comp4905-backend1
    environment:
      - INSTANCE_NAME=backend1
      - PORT=9090
    volumes:
      - ./docker/backend.py:/app/backend.py:ro
    command: python /app/backend.py
    expose:
      - "9090"

  backend2:
    image: python:3.12-slim
    container_name: comp4905-backend2
    environment:
      - INSTANCE_NAME=backend2
      - PORT=9090
    volumes:
      - ./docker/backend.py:/app/backend.py:ro
    command: python /app/backend.py
    expose:
      - "9090"

  nginx:
    image: nginx:alpine
    container_name: comp4905-nginx
    depends_on:
      - backend1
      - backend2
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
